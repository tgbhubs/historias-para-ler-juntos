<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lendo — Histórias para Ler Juntos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    html, body { height: 100%; height: 100dvh; overflow: hidden; }
  </style>
</head>
<body>

<div class="reader-wrap">

  <!-- Barra superior -->
  <div class="reader-bar">
    <div class="reader-bar__title font-display" id="reader-title">Carregando...</div>
    <div class="reader-bar__right">
      <span class="reader-bar__page" id="reader-page-num"></span>
      <button class="reader-bar__btn" onclick="exitReader()" title="Sair do leitor" aria-label="Sair">✕</button>
    </div>
  </div>

  <!-- Barra de progresso -->
  <div class="reader-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
    <div class="reader-progress__bar" id="reader-progress-bar" style="width:0%"></div>
  </div>

  <!-- Palco das páginas -->
  <div class="reader-stage" id="reader-stage">
    <!-- Páginas renderizadas via reader.js -->
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.4);">
      <span style="font-size:2rem">🌲</span>
    </div>
  </div>

</div>

<script src="../assets/js/reader.js"></script>
</body>
</html>
